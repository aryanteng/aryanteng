<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
<title id="t">Aryan Teng: full-stack product engineer</title>
<desc id="d">I build AI products end to end, from the UX to the on-prem deploy. Led the React 19 rebuild of UVIP with 300+ typed APIs; cut deploy time 90% for 50 computer-vision apps; Seek search used at 33 Indian airports; a ClickHouse pipeline at 20M+ events a day.</desc>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#262B28"/></pattern>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
<mask id="fade"><rect width="1000" height="360" fill="url(#g)"/></mask>
<style>@font-face{font-family:S;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:S;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:J;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:S,system-ui,sans-serif;fill:#ECEAE3}
.cap,.stack,.lab,.prompt{font-family:J,ui-monospace,monospace}
.cap{font-size:13px;letter-spacing:2.5px;fill:#8E938F}
.name{font-size:74px;font-weight:700;letter-spacing:-2.5px}
.dot{fill:#FF6B2C}
.role{font-size:23px;font-weight:500;letter-spacing:-.2px}
.dim{fill:#8E938F}
.stack{font-size:13.5px;fill:#8E938F}
.prompt{font-size:17px;fill:#FF6B2C}
.tick{font-size:18px;font-weight:500;opacity:0;animation:tick 18s linear infinite backwards}
.t0{opacity:1}
.fig{font-size:30px;font-weight:700;letter-spacing:-.5px}
.lab{font-size:11.5px;fill:#8E938F}
.tile{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:flow 4s linear infinite}
@keyframes tick{0%{opacity:0;transform:translateY(8px)}1.67%,15.00%{opacity:1;transform:none}16.67%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(904px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse{display:none}}
</style>
</defs>
<rect x=".5" y=".5" width="999" height="359" rx="16" fill="#0C0E0D" stroke="#2E3330"/>
<rect x=".5" y=".5" width="999" height="359" rx="16" fill="url(#dots)" mask="url(#fade)"/>
<text class="cap" x="48" y="56">FULL-STACK PRODUCT ENGINEER</text>
<text class="cap" x="952" y="56" text-anchor="end">SDE II · AWIROS · NEW DELHI</text>
<text class="name" x="45" y="136">Aryan Teng<tspan class="dot">.</tspan></text>
<text class="role" x="48" y="178">I build AI products end to end,</text>
<text class="role dim" x="48" y="206">from the UX to the on-prem deploy.</text>
<text class="stack" x="48" y="240">React · TypeScript · React Native · Node.js · Go · Kafka</text>
<text class="prompt" x="48" y="276">▸</text>
<text class="tick t0" x="72" y="276" style="animation-delay:0s">UVIP · led the React 19 rebuild, product and UX</text>
<text class="tick" x="72" y="276" style="animation-delay:3s">50 CV apps · a 3-hour Jenkins build became per-app images</text>
<text class="tick" x="72" y="276" style="animation-delay:6s">Two React Native apps, built solo</text>
<text class="tick" x="72" y="276" style="animation-delay:9s">Enterprise SSO · LDAP and OIDC, shipped to customers</text>
<text class="tick" x="72" y="276" style="animation-delay:12s">Seek · search used at 33 Indian airports</text>
<text class="tick" x="72" y="276" style="animation-delay:15s">ClickHouse pipeline · 20M+ events a day</text>
<g class="tile" style="animation-delay:0.15s"><rect x="572" y="86" width="184" height="72" rx="10" fill="#131614" stroke="#2E3330"/><text class="fig" x="588" y="124">300+</text><text class="lab" x="588" y="144">typed APIs · UVIP</text></g><g class="tile" style="animation-delay:0.27s"><rect x="768" y="86" width="184" height="72" rx="10" fill="#131614" stroke="#2E3330"/><text class="fig" x="784" y="124">−90%</text><text class="lab" x="784" y="144">deploy time, 50 apps</text></g><g class="tile" style="animation-delay:0.39s"><rect x="572" y="170" width="184" height="72" rx="10" fill="#131614" stroke="#2E3330"/><text class="fig" x="588" y="208">33</text><text class="lab" x="588" y="228">airports use Seek</text></g><g class="tile" style="animation-delay:0.51s"><rect x="768" y="170" width="184" height="72" rx="10" fill="#131614" stroke="#2E3330"/><text class="fig" x="784" y="208">20M+</text><text class="lab" x="784" y="228">events/day, ClickHouse</text></g>
<line x1="48" y1="310" x2="952" y2="310" stroke="#2E3330" stroke-width="1.5"/>
<rect x="44.5" y="306.5" width="7" height="7" fill="#ECEAE3"/><rect x="225.3" y="306.5" width="7" height="7" fill="#ECEAE3"/><rect x="406.1" y="306.5" width="7" height="7" fill="#ECEAE3"/><rect x="586.9" y="306.5" width="7" height="7" fill="#ECEAE3"/><rect x="767.7" y="306.5" width="7" height="7" fill="#ECEAE3"/><rect x="948.5" y="306.5" width="7" height="7" fill="#ECEAE3"/><g class="pulse" style="animation-delay:0.00s"><circle cx="48" cy="310" r="9" fill="#FF6B2C" opacity=".18"/><circle cx="48" cy="310" r="3.5" fill="#FF6B2C"/></g><g class="pulse" style="animation-delay:-1.33s"><circle cx="48" cy="310" r="9" fill="#FF6B2C" opacity=".18"/><circle cx="48" cy="310" r="3.5" fill="#FF6B2C"/></g><g class="pulse" style="animation-delay:-2.67s"><circle cx="48" cy="310" r="9" fill="#FF6B2C" opacity=".18"/><circle cx="48" cy="310" r="3.5" fill="#FF6B2C"/></g><text class="lab" x="48.0" y="338" text-anchor="start">ux</text><text class="lab" x="228.8" y="338" text-anchor="middle">react</text><text class="lab" x="409.6" y="338" text-anchor="middle">api</text><text class="lab" x="590.4" y="338" text-anchor="middle">data</text><text class="lab" x="771.2" y="338" text-anchor="middle">deploy</text><text class="lab" x="952.0" y="338" text-anchor="end">on-site</text>
</svg>

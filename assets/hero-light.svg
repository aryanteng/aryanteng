<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
<title id="t">Aryan Teng: systems and product engineer</title>
<desc id="d">Real-time AI systems, end to end. Seek vector search, used at 33 Indian airports, made every alert searchable (up from 58%) at 650K alerts and 1.3M embeddings a day.</desc>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#DDD9CE"/></pattern>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
<mask id="fade"><rect width="1000" height="360" fill="url(#g)"/></mask>
<style>@font-face{font-family:J;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:J;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:J;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:J,ui-monospace,monospace;fill:#151716}
.cap{font-size:13px;font-weight:400;letter-spacing:2.5px;fill:#5B5F5C}
.name{font-size:76px;font-weight:800;letter-spacing:-3px}
.role{font-size:22px;font-weight:400}
.stack{font-size:17px;fill:#5B5F5C}
.prompt{font-size:19px;fill:#C2410C}
.tick{font-size:19px;opacity:0;animation:tick 12s linear infinite backwards}
.t0{opacity:1}.t1{animation-delay:3s}.t2{animation-delay:6s}.t3{animation-delay:9s}
.val{font-size:18px;font-weight:700}.v0{fill:#5B5F5C}.v1{fill:#C2410C}
.lab{font-size:13px;fill:#5B5F5C}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
.pulse{animation:flow 4s linear infinite}
@keyframes tick{0%{opacity:0;transform:translateY(8px)}2%,23%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes grow{0%,10%{transform:scaleX(0.58)}34%,92%{transform:scaleX(1);opacity:1}96%{opacity:0}100%{transform:scaleX(0.58);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(904px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse{display:none}}
</style>
</defs>
<rect x=".5" y=".5" width="999" height="359" rx="16" fill="#F6F4EE" stroke="#D4D0C4"/>
<rect x=".5" y=".5" width="999" height="359" rx="16" fill="url(#dots)" mask="url(#fade)"/>
<text class="cap" x="48" y="58">SYSTEMS + PRODUCT ENGINEER</text>
<text class="cap" x="952" y="58" text-anchor="end">SDE II · AWIROS · NEW DELHI</text>
<text class="name" x="45" y="146">Aryan Teng</text>
<rect class="cursor" x="478" y="92" width="22" height="60" fill="#C2410C"/>
<text class="role" x="48" y="190">Real-time AI systems, end to end.</text>
<text class="stack" x="48" y="220">Go · Kafka · Milvus · ClickHouse · React</text>
<text class="prompt" x="48" y="258">▸</text>
<text class="tick t0" x="74" y="258">Seek · vector search used at 33 Indian airports</text>
<text class="tick t1" x="74" y="258">650K alerts and 1.3M embeddings a day</text>
<text class="tick t2" x="74" y="258">UVIP · React 19 rebuild, 300+ typed endpoints</text>
<text class="tick t3" x="74" y="258">ClickHouse pipeline · 20M+ events a day</text>
<text class="cap" x="600" y="110">ALERTS SEARCHABLE · SEEK</text>
<text class="val v0" x="600" y="148">58%</text>
<rect x="668" y="134" width="164.7" height="16" fill="#D4D0C4"/>
<text class="val v1" x="600" y="182">100%</text>
<rect class="bar" x="668" y="168" width="284" height="16" fill="#C2410C"/>
<text class="lab" x="600" y="214">natural-language search over every alert</text>
<line x1="48" y1="306" x2="952" y2="306" stroke="#D4D0C4" stroke-width="1.5"/>
<rect x="44.5" y="302.5" width="7" height="7" fill="#151716"/><rect x="225.3" y="302.5" width="7" height="7" fill="#151716"/><rect x="406.1" y="302.5" width="7" height="7" fill="#151716"/><rect x="586.9" y="302.5" width="7" height="7" fill="#151716"/><rect x="767.7" y="302.5" width="7" height="7" fill="#151716"/><rect x="948.5" y="302.5" width="7" height="7" fill="#151716"/>
<g class="pulse" style="animation-delay:0.00s"><circle cx="48" cy="306" r="9" fill="#C2410C" opacity=".18"/><circle cx="48" cy="306" r="3.5" fill="#C2410C"/></g>
<g class="pulse" style="animation-delay:-1.33s"><circle cx="48" cy="306" r="9" fill="#C2410C" opacity=".18"/><circle cx="48" cy="306" r="3.5" fill="#C2410C"/></g>
<g class="pulse" style="animation-delay:-2.67s"><circle cx="48" cy="306" r="9" fill="#C2410C" opacity=".18"/><circle cx="48" cy="306" r="3.5" fill="#C2410C"/></g>
<text class="lab" x="48.0" y="334" text-anchor="start">events</text><text class="lab" x="228.8" y="334" text-anchor="middle">kafka</text><text class="lab" x="409.6" y="334" text-anchor="middle">embed</text><text class="lab" x="590.4" y="334" text-anchor="middle">milvus</text><text class="lab" x="771.2" y="334" text-anchor="middle">grpc</text><text class="lab" x="952.0" y="334" text-anchor="end">react</text>
</svg>
